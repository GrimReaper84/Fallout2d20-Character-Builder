[versions]
javafx-runtime = "21.0.6"
javafx-plugin = "0.1.0"
jlink-plugin = "4.1.1"
errorprone-plugin = "4.0.1"
jspecify = "1.0.0"
jackson = "2.17.2"
controlsfx = "11.2.1"
miglayout = "11.4.3"
ikonli = "12.4.0"
pdfbox = "3.0.5"
errorprone-core = "2.26.1"
nullaway = "0.10.22"
junit-bom = "6.0.0"

[libraries]
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
controlsfx = { module = "org.controlsfx:controlsfx", version.ref = "controlsfx" }
miglayout-javafx = { module = "com.miglayout:miglayout-javafx", version.ref = "miglayout" }
ikonli-javafx = { module = "org.kordamp.ikonli:ikonli-javafx", version.ref = "ikonli" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
ikonli-fontawesome6-pack = { module = "org.kordamp.ikonli:ikonli-fontawesome6-pack", version.ref = "ikonli" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone-core" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
javafx = { id = "org.openjfx.javafxplugin", version.ref = "javafx-plugin" }
jlink = { id = "org.beryx.jlink", version.ref = "jlink-plugin" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
